name: Build mod jar
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          test -f project.zip || { echo "project.zip topilmadi (uni repository ildiziga yuklang)"; exit 1; }
          rm -rf proj && mkdir proj && unzip -q project.zip -d proj
          find proj -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Build
        run: gradle build --no-daemon -p proj
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cosmetics-mod-jar
          path: proj/build/libs/*.jar
