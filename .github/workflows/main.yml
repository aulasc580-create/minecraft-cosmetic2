name: Build mod jar
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files
        run: |
          J=src/main/java/uz/cosmeticsmod
          R=src/main/resources
          mkdir -p $J $R/assets/cosmetics/models $R/assets/cosmetics/lang $R/assets/cosmetics/textures/cosmetic
          mv -f *.java $J/ || true
          mv -f *.quads $R/assets/cosmetics/models/ || true
          if [ -f icon.png ]; then mv -f icon.png $R/assets/cosmetics/; fi
          mv -f *.png $R/assets/cosmetics/textures/cosmetic/ || true
          if [ -f fabric.mod.json ]; then mv -f fabric.mod.json $R/; fi
          if [ -f en_us.json ]; then mv -f en_us.json $R/assets/cosmetics/lang/; fi
          find . -path ./.git -prune -o -type f -print | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Build
        run: gradle build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cosmetics-mod-jar
          path: build/libs/*.jar
